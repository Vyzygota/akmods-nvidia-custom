name: akmods-nvidia-custom Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *" # Codziennie w nocy o 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Wymuś build nawet bez zmian wersji'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:
  matrix-spider:
    name: Cyber-Pająk Zwiadowca
    runs-on: ubuntu-latest
    outputs:
      fedora: ${{ steps.scrape.outputs.fedora }}
      nvidia: ${{ steps.scrape.outputs.nvidia }}
      linux: ${{ steps.scrape.outputs.linux }}
      changed: ${{ steps.compare.outputs.changed }}
      linux_available: ${{ steps.scrape.outputs.linux_available }}
      bazzite: ${{ steps.scrape.outputs.bazzite }}
      evdi: ${{ steps.scrape.outputs.evdi }}
      lll: ${{ steps.scrape.outputs.lll }}
      nvidia_url: ${{ steps.scrape.outputs.nvidia_url }}
      evdi_url: ${{ steps.scrape.outputs.evdi_url }}
      lll_url: ${{ steps.scrape.outputs.lll_url }}
      sources: ${{ steps.scrape.outputs.sources }}
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v6

      - name: Wykrywanie Najnowszych Wersji
        id: scrape
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Przyczyna awarii trafia też do pliku — odczyta ją krok alarmu Discord na końcu jobu.
          SPIDER_ERR="$RUNNER_TEMP/spider_error.txt"
          die() { echo "KRYTYCZNY BŁĄD: $*"; echo "$*" > "$SPIDER_ERR"; exit 1; }

          # skopeo bywa już zainstalowany na runnerze — doinstaluj tylko gdy go brak
          command -v skopeo >/dev/null || sudo apt-get install -y -q skopeo 2>&1 | tail -1

          # 1. Najnowsza Fedora, dla której Bazzite publikuje stabilny obraz bazowy (stable-<Fedora>).
          #    GA Fedory bywa przed Bazzite — wtedy zostajemy na ostatniej wersji obsługiwanej przez Bazzite.
          #    Brak tagu ("manifest unknown") = próbuj niższą Fedorę; każdy inny błąd przerywa (bez cichego cofnięcia wersji).
          SKOPEO_ERR=$(mktemp)
          FEDORA_VER=""
          for v in $(curl -sL https://dl.fedoraproject.org/pub/fedora/linux/releases/ \
              | grep -oE 'href="[0-9]+/"' | grep -oE '[0-9]+' | sort -rn); do
            if BAZZITE_META=$(skopeo inspect --no-creds \
                "docker://ghcr.io/ublue-os/bazzite-deck-nvidia:stable-${v}" 2>"$SKOPEO_ERR"); then
              FEDORA_VER=$v
              break
            fi
            if ! grep -q 'manifest unknown' "$SKOPEO_ERR"; then
              die "skopeo inspect stable-${v} zwrócił nieoczekiwany błąd: $(head -c 300 "$SKOPEO_ERR")"
            fi
            echo "Bazzite nie publikuje jeszcze stable-${v} — próbuję niższą Fedorę..."
          done
          if [ -z "$FEDORA_VER" ]; then
            die "Nie znaleziono Fedory z obrazem Bazzite stable-<wersja>"
          fi

          # 2. NVIDIA — jedyne źródło prawdy: Bazzite base image
          echo "--- Wykrywanie wersji NVIDIA z Bazzite base image (stable-${FEDORA_VER}) ---"
          BAZZITE_IMG_LABEL=$(jq -r '.Labels["org.opencontainers.image.version"]' <<<"$BAZZITE_META")

          # Tag releasu w ublue-os/bazzite to pełna etykieta obrazu (np. "44.20260929");
          # do versions.lock trafia sama wersja bez ewentualnego prefiksu kanału (np. "testing-").
          BAZZITE_TAG="$BAZZITE_IMG_LABEL"
          BAZZITE_VER=$(sed -E 's/^[a-z]+-//' <<<"$BAZZITE_IMG_LABEL")
          echo "Bazzite base image: $BAZZITE_IMG_LABEL (release tag: $BAZZITE_TAG, wersja: $BAZZITE_VER)"

          NVIDIA_VER=$(gh release view "${BAZZITE_TAG}" --repo ublue-os/bazzite --json body \
            -q '.body' 2>/dev/null \
            | grep "Nvidia Open" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)

          if [ -z "$NVIDIA_VER" ]; then
            echo "Brak release Bazzite dla '${BAZZITE_TAG}' — szukam w najnowszym stable release..."
            # Bez okna na liczbę releasów: --paginate idzie od najnowszych aż do pierwszego stable dla tej Fedory.
            LATEST_STABLE_TAG=$(gh api --paginate "repos/ublue-os/bazzite/releases?per_page=100" \
              --jq ".[] | select(.prerelease==false and .draft==false) | select(.tag_name|startswith(\"${FEDORA_VER}.\")) | .tag_name" \
              | grep -m1 -E "^${FEDORA_VER}\." || true)
            if [ -n "$LATEST_STABLE_TAG" ]; then
              NVIDIA_VER=$(gh release view "${LATEST_STABLE_TAG}" --repo ublue-os/bazzite --json body \
                -q '.body' 2>/dev/null \
                | grep "Nvidia Open" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
            fi
            echo "Fallback do '${LATEST_STABLE_TAG:-brak}' → NVIDIA '${NVIDIA_VER:-brak}'"
          fi

          if [ -z "$NVIDIA_VER" ]; then
            die "Nie udało się pobrać wersji NVIDIA z Bazzite releases (obraz stable-${FEDORA_VER}, tag '${BAZZITE_TAG}')"
          fi

          echo "NVIDIA (z Bazzite): $NVIDIA_VER"

          # 3. Najnowszy stable kernel dostępny dla aktualnej Fedory (z COPR kernel-vanilla/fedora)
          LINUX_VER_LATEST=$(curl -sL https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          # Filtr po pakiecie po stronie API (zamiast okna "ostatnie N buildów" całego projektu);
          # select po nazwie w jq zostaje jako asekuracja, gdyby API zignorowało parametr.
          LINUX_VER_COPR=$(curl -s "https://copr.fedorainfracloud.org/api_3/build/list?ownername=@kernel-vanilla&projectname=fedora&packagename=stable-fedora-releases&status=succeeded" \
            | jq -r --arg fc "fedora-${FEDORA_VER}-x86_64" \
            '[.items[] | select(.source_package.name=="stable-fedora-releases") | select(.chroots[] | contains($fc))] | first | .source_package.version | split("-")[0]' \
            2>/dev/null | grep -v null || true)
          LINUX_VER="${LINUX_VER_COPR:-$LINUX_VER_LATEST}"
          echo "kernel.org latest: $LINUX_VER_LATEST | COPR f${FEDORA_VER}: ${LINUX_VER_COPR:-nie znaleziono} | używam: $LINUX_VER"

          # 4. evdi (DisplayLink — wymagany przez Viture Beast XR) — najnowszy stable release
          EVDI_VER=$(gh api repos/DisplayLink/evdi/releases/latest --jq '.tag_name' | sed 's/^v//')
          if [ -z "$EVDI_VER" ]; then
            die "Nie udało się pobrać wersji evdi z GitHub"
          fi
          echo "evdi (DisplayLink): $EVDI_VER"

          # 5. LenovoLegionLinux — najnowszy stable release (zamiast ruchomej gałęzi main)
          LLL_TAG=$(gh api repos/johnfanv2/LenovoLegionLinux/releases/latest --jq '.tag_name')
          if [ -z "$LLL_TAG" ]; then
            die "Nie udało się pobrać wersji LenovoLegionLinux z GitHub"
          fi
          echo "LenovoLegionLinux: $LLL_TAG"

          # 6. Adresy źródeł wszystkich składników, które buduje Fabryka — i kontrola, że każdy odpowiada,
          #    zanim wystartuje kosztowny build. Fabryka dostaje adresy jako build-argi (nie składa ich sama).
          NVIDIA_URL="https://us.download.nvidia.com/XFree86/Linux-x86_64/${NVIDIA_VER}/NVIDIA-Linux-x86_64-${NVIDIA_VER}.run"
          EVDI_URL="https://github.com/DisplayLink/evdi/archive/refs/tags/v${EVDI_VER}.tar.gz"
          LLL_URL="https://github.com/johnfanv2/LenovoLegionLinux/archive/refs/tags/${LLL_TAG}.tar.gz"
          KERNEL_REPO_URL="https://download.copr.fedorainfracloud.org/results/@kernel-vanilla/fedora/fedora-${FEDORA_VER}-x86_64/"

          FAILED=""
          MANIFEST='[]'
          add_source() {  # nazwa wersja adres [adres-do-sprawdzenia]
            local name="$1" ver="$2" url="$3" check="${4:-$3}" code
            code=$(curl -sIL --max-time 60 -o /dev/null -w '%{http_code}' "$check" 2>/dev/null || true)
            [ -n "$code" ] || code=000
            echo "  [HTTP $code] $name $ver — $url"
            [ "$code" = "200" ] || FAILED="$FAILED $name"
            MANIFEST=$(jq -c --arg n "$name" --arg v "$ver" --arg u "$url" --arg c "HTTP $code" \
              '. + [{name:$n, version:$v, url:$u, verified:$c}]' <<<"$MANIFEST")
          }
          echo "--- Źródła składników (kontrola dostępności) ---"
          add_source kernel "$LINUX_VER" "$KERNEL_REPO_URL" "${KERNEL_REPO_URL}repodata/repomd.xml"
          [ -n "$LINUX_VER_COPR" ] || { echo "  COPR nie ma jeszcze kernela dla f${FEDORA_VER} (kernel.org: $LINUX_VER_LATEST)"; FAILED="$FAILED kernel-COPR"; }
          add_source nvidia "$NVIDIA_VER" "$NVIDIA_URL"
          add_source evdi "$EVDI_VER" "$EVDI_URL"
          add_source lenovo-legion-linux "$LLL_TAG" "$LLL_URL"
          MANIFEST=$(jq -c --arg v "$BAZZITE_IMG_LABEL" --arg u "docker://ghcr.io/ublue-os/bazzite-deck-nvidia:stable-${FEDORA_VER}" \
            '. + [{name:"bazzite-base", version:$v, url:$u, verified:"skopeo inspect"}]' <<<"$MANIFEST")
          if [ -n "$FAILED" ]; then
            die "niedostępne źródła:$FAILED — przerywam przed buildem"
          fi
          SOURCES=$(jq -c -n --arg fedora "$FEDORA_VER" --argjson components "$MANIFEST" '{fedora:$fedora, components:$components}')
          {
            echo "### Źródła wydania (Cyber-Pająk)"
            echo
            echo "| Składnik | Wersja | Źródło | Sprawdzone |"
            echo "|---|---|---|---|"
            jq -r '.components[] | "| \(.name) | \(.version) | \(.url) | \(.verified) |"' <<<"$SOURCES"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Znalazłem: Fedora=$FEDORA_VER, NVIDIA=$NVIDIA_VER, LINUX=$LINUX_VER, Bazzite=$BAZZITE_VER, evdi=$EVDI_VER, LLL=$LLL_TAG"
          echo "fedora=$FEDORA_VER"    >> "$GITHUB_OUTPUT"
          echo "nvidia=$NVIDIA_VER"   >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX_VER"     >> "$GITHUB_OUTPUT"
          echo "linux_available=${LINUX_VER_COPR:-nie}" >> "$GITHUB_OUTPUT"
          echo "bazzite=$BAZZITE_VER" >> "$GITHUB_OUTPUT"
          echo "evdi=$EVDI_VER"       >> "$GITHUB_OUTPUT"
          echo "lll=$LLL_TAG"         >> "$GITHUB_OUTPUT"
          echo "nvidia_url=$NVIDIA_URL" >> "$GITHUB_OUTPUT"
          echo "evdi_url=$EVDI_URL"   >> "$GITHUB_OUTPUT"
          echo "lll_url=$LLL_URL"     >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES"     >> "$GITHUB_OUTPUT"

      - name: Sprawdź czy wersje się zmieniły
        id: compare
        run: |
          NEW="fedora=${{ steps.scrape.outputs.fedora }} nvidia=${{ steps.scrape.outputs.nvidia }} linux=${{ steps.scrape.outputs.linux }} bazzite=${{ steps.scrape.outputs.bazzite }} evdi=${{ steps.scrape.outputs.evdi }} lll=${{ steps.scrape.outputs.lll }}"
          OLD=$(cat versions.lock 2>/dev/null || echo "")
          if [ "$OLD" = "$NEW" ]; then
            echo "Brak zmian wersji — pomijam build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Wykryto zmiany: $OLD → $NEW"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Powiadom o awarii Pająka
        if: failure() && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCRAPE_OUTCOME" = "failure" ]; then STEP="Wykrywanie Najnowszych Wersji"
          elif [ "$COMPARE_OUTCOME" = "failure" ]; then STEP="Sprawdź czy wersje się zmieniły"
          else STEP="przygotowanie jobu (checkout)"; fi
          REASON=$(head -c 600 "$RUNNER_TEMP/spider_error.txt" 2>/dev/null || true)
          MSG="🕷️ **ALARM!** Cyber-Pająk nie zebrał źródeł dla Fabryki — padł krok: ${STEP}. Fabryka nie zbuduje nowych wersji, dopóki to nie zostanie naprawione."
          if [ -n "$REASON" ]; then MSG="${MSG}"$'\n'"Przyczyna: ${REASON}"; fi
          MSG="${MSG}"$'\n'"Log: ${RUN_URL}"
          if [ -n "$DISCORD_WEBHOOK" ]; then
            CODE=$(jq -n --arg c "$MSG" '{content:$c}' \
              | curl -sS -o /dev/null -w '%{http_code}' -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" || true)
            echo "Discord: HTTP ${CODE:-000}"
          else
            echo "Pająk zakończył się błędem, ale brak skonfigurowanego webhooka w zakładce Secrets."
          fi

  build:
    name: Fabryka "All Latest"
    needs: matrix-spider
    if: needs.matrix-spider.outputs.changed == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v6

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowanie i Wypychanie Obrazu
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          # Obraz publikujemy tylko z main; uruchomienie z innej gałęzi (np. PR) robi pełny build bez push,
          # bez zapisu locka, bez dispatchu do BEB i bez alarmu — bezpieczna weryfikacja zmian.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vyzygota/akmods-nvidia-custom:latest
          build-args: |
            FEDORA_VERSION=${{ needs.matrix-spider.outputs.fedora }}
            NVIDIA_VERSION=${{ needs.matrix-spider.outputs.nvidia }}
            NVIDIA_URL=${{ needs.matrix-spider.outputs.nvidia_url }}
            LINUX_VERSION=${{ needs.matrix-spider.outputs.linux }}
            EVDI_VERSION=${{ needs.matrix-spider.outputs.evdi }}
            EVDI_URL=${{ needs.matrix-spider.outputs.evdi_url }}
            LLL_URL=${{ needs.matrix-spider.outputs.lll_url }}

      - name: Zaktualizuj versions.lock
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "fedora=${{ needs.matrix-spider.outputs.fedora }} nvidia=${{ needs.matrix-spider.outputs.nvidia }} linux=${{ needs.matrix-spider.outputs.linux }} bazzite=${{ needs.matrix-spider.outputs.bazzite }} evdi=${{ needs.matrix-spider.outputs.evdi }} lll=${{ needs.matrix-spider.outputs.lll }}" > versions.lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.lock
          git commit -m "chore: update versions.lock [skip ci]"
          git pull --rebase origin main
          git push

      - name: Uruchom BleedingEdgeBazzite
        if: success() && github.ref == 'refs/heads/main'
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.BEB_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Vyzygota/BleedingEdgeBazzite/dispatches \
            -d "{\"event_type\":\"akmods_updated\",\"client_payload\":{\"fedora_version\":\"${{ needs.matrix-spider.outputs.fedora }}\"}}")
          if [ "$HTTP_STATUS" = "204" ]; then
            echo "✅ BEB dispatch wysłany pomyślnie."
          else
            echo "❌ BEB dispatch nie powiódł się — HTTP $HTTP_STATUS. Sprawdź secret BEB_DISPATCH_TOKEN."
            exit 1
          fi

      - name: Powiadom o pożarze w fabryce "All Latest"
        if: failure() && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **ALARM!** Cyber-Pająk melduje: Kompilacja All Latest (Kernel ${{ needs.matrix-spider.outputs.linux }} + NVIDIA ${{ needs.matrix-spider.outputs.nvidia }}) właśnie eksplodowała! Pancerz ochronny nie wytrzymał. Wymagana interwencja twórcy!\"}" \
            $DISCORD_WEBHOOK
          else
            echo "Kompilacja zakończona błędem, ale brak skonfigurowanego webhooka w zakładce Secrets."
          fi
